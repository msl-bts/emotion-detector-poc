<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mood Reader</title>
<style>
  :root {
    --bg: #fff6d6; --ink: #2b2420; --card: #ffffffcc; --accent: #f5b700;
  }
  body[data-mood="happy"]   { --bg: #fff1a8; --accent: #f5b700; }
  body[data-mood="sad"]     { --bg: #cfe0f5; --accent: #3b6fb6; }
  body[data-mood="excited"] { --bg: #ffd1c2; --accent: #ef4b2f; }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    min-height: 100vh; background: var(--bg); color: var(--ink);
    font-family: "Trebuchet MS", "Segoe UI", system-ui, sans-serif;
    transition: background .5s ease;
    display: grid; place-items: center; padding: 24px;
  }
  main { width: 100%; max-width: 720px; }
  h1 { font-size: clamp(2rem, 6vw, 3rem); margin: 0 0 4px; letter-spacing: -0.02em; }
  .sub { margin: 0 0 24px; opacity: .75; }
  .panel {
    background: var(--card); border-radius: 24px; padding: 20px;
    display: grid; gap: 20px; grid-template-columns: 1fr 1fr;
  }
  @media (max-width: 640px) { .panel { grid-template-columns: 1fr; } }
  .view {
    aspect-ratio: 1; border-radius: 16px; background: #0001;
    display: grid; place-items: center; overflow: hidden; position: relative;
  }
  .view canvas, .view img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .placeholder { padding: 16px; text-align: center; opacity: .6; }
  .actions { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 12px; grid-column: 1 / -1; }
  button, label.btn {
    font: inherit; font-weight: 700; cursor: pointer; border: 0;
    padding: 12px 18px; border-radius: 999px; background: var(--ink); color: #fff;
  }
  button.alt, label.btn { background: transparent; color: var(--ink); box-shadow: inset 0 0 0 2px var(--ink); }
  button:focus-visible, label.btn:focus-within { outline: 3px solid var(--accent); outline-offset: 2px; }
  button:disabled { opacity: .5; cursor: not-allowed; }
  input[type=file] { position: absolute; opacity: 0; width: 0; height: 0; }
  .result { display: flex; flex-direction: column; justify-content: center; gap: 14px; }
  .face { font-size: 5rem; line-height: 1; }
  .mood { font-size: 1.8rem; font-weight: 800; margin: 0; }
  .bar { display: grid; grid-template-columns: 80px 1fr 48px; align-items: center; gap: 8px; font-size: .95rem; }
  .track { height: 12px; background: #0002; border-radius: 99px; overflow: hidden; }
  .fill { height: 100%; width: 0; background: var(--accent); border-radius: 99px; transition: width .2s ease; }
  .status { min-height: 1.4em; font-size: .9rem; opacity: .75; }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body data-mood="">
<main>
  <h1>Mood Reader</h1>
  <p class="sub">Show your face or upload a photo. The model tells you if you look happy, sad or excited.</p>

  <section class="panel">
    <div>
      <div class="view" id="view">
        <div class="placeholder" id="placeholder">Start the camera or upload a photo</div>
      </div>
      <div class="actions">
        <button id="camBtn">Start camera</button>
        <label class="btn">Upload photo
          <input type="file" id="file" accept="image/*">
        </label>
        <button class="alt" id="stopBtn" disabled>Stop</button>
      </div>
    </div>

    <div class="result" aria-live="polite">
      <div class="face" id="face">🤔</div>
      <p class="mood" id="mood">Waiting for an image</p>
      <div id="bars"></div>
      <div class="status" id="status">Loading model…</div>
    </div>
  </section>
</main>

<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@1.3.1/dist/tf.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@teachablemachine/image@0.8.5/dist/teachablemachine-image.min.js"></script>
<script>
  // 1) PASTE YOUR TEACHABLE MACHINE MODEL URL HERE (must end with a slash)
  const MODEL_URL = "https://teachablemachine.withgoogle.com/models/dkZDNl46g/";

  // 2) Emoji per class. Keys must match your class names (case-insensitive).
  const EMOJI = { happy: "😄", sad: "😢", excited: "🤩" };

  let model, webcam, rafId = null, running = false;
  const $ = id => document.getElementById(id);
  const view = $("view"), statusEl = $("status");

  async function loadModel() {
    try {
      model = await tmImage.load(MODEL_URL + "model.json", MODEL_URL + "metadata.json");
      const labels = model.getClassLabels();
      $("bars").innerHTML = labels.map((l, i) => `
        <div class="bar"><span>${l}</span>
        <div class="track"><div class="fill" id="f${i}"></div></div>
        <span id="p${i}">0%</span></div>`).join("");
      statusEl.textContent = "Model ready.";
    } catch (e) {
      statusEl.textContent = "Could not load the model. Check MODEL_URL in index.html.";
      console.error(e);
    }
  }

  function show(predictions) {
    let best = predictions[0];
    predictions.forEach((p, i) => {
      const pct = Math.round(p.probability * 100);
      $("f" + i).style.width = pct + "%";
      $("p" + i).textContent = pct + "%";
      if (p.probability > best.probability) best = p;
    });
    const key = best.className.trim().toLowerCase();
    document.body.dataset.mood = key;
    $("face").textContent = EMOJI[key] || "🙂";
    $("mood").textContent = best.className;
  }

  async function startCamera() {
    if (!model) {
      statusEl.textContent = "Model not loaded yet. Check MODEL_URL, then refresh.";
      return;
    }
    if (!window.isSecureContext) {
      statusEl.textContent = "Camera needs https or localhost. Open the GitHub Pages link instead of the file.";
      return;
    }
    stopCamera();
    statusEl.textContent = "Starting camera…";
    try {
      webcam = new tmImage.Webcam(400, 400, true);
      await webcam.setup();
      await webcam.play();
    } catch (e) {
      const why = { NotAllowedError: "Permission denied. Click the lock icon in the address bar and allow Camera.",
                    NotFoundError: "No camera found on this device.",
                    NotReadableError: "Camera is in use by another app. Close it and retry." };
      statusEl.textContent = why[e.name] || ("Camera error: " + (e.message || e.name));
      console.error(e);
      return;
    }
    view.innerHTML = "";
    view.appendChild(webcam.canvas);
    running = true;
    $("stopBtn").disabled = false;
    statusEl.textContent = "Live";
    loop();
  }

  async function loop() {
    if (!running) return;
    webcam.update();
    show(await model.predict(webcam.canvas));
    rafId = requestAnimationFrame(loop);
  }

  function stopCamera() {
    running = false;
    if (rafId) cancelAnimationFrame(rafId);
    if (webcam) { webcam.stop(); webcam = null; }
    $("stopBtn").disabled = true;
  }

  $("file").addEventListener("change", e => {
    const f = e.target.files[0];
    if (!f || !model) return;
    stopCamera();
    const img = new Image();
    img.onload = async () => {
      view.innerHTML = "";
      view.appendChild(img);
      show(await model.predict(img));
      statusEl.textContent = "Done";
    };
    img.src = URL.createObjectURL(f);
    e.target.value = "";
  });

  $("camBtn").addEventListener("click", startCamera);
  $("stopBtn").addEventListener("click", () => {
    stopCamera();
    statusEl.textContent = "Camera stopped.";
  });

  loadModel();
</script>
</body>
</html>
